server {
    listen 80;
    server_name localhost;

    # 启用 Gzip 深度压缩，提升 3D 模型与静态资源加载速度
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/json model/gltf-binary;
    gzip_vary on;

    # 静态前端资源分发
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 3D 资产静态缓存优化
    location ~* \.(glb|gltf|bin|png|jpg|jpeg|svg|ico)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # WebSocket 网关同源反向代理
    location /v1/telemetry {
        proxy_pass http://backend:8080/v1/telemetry;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}