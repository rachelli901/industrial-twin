services:
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    # Internal demo broker only; no host port is published.
    command: mosquitto -c /mosquitto-no-auth.conf
    networks: [twin-network]
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      WS_HOST: 0.0.0.0
      WS_PORT: 8080
      GATEWAY_MODE: ${GATEWAY_MODE:-MOCK}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?Set GATEWAY_TOKEN in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:7000,http://127.0.0.1:7000}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-mqtt://mqtt-broker:1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    depends_on: [mqtt-broker]
    networks: [twin-network]
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:7000:80"]
    depends_on: [backend]
    networks: [twin-network]
networks:
  twin-network:
    driver: bridge
